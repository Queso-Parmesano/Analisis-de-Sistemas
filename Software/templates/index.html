<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página Principal</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('/fondoindex.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative; /* Para poder posicionar el overlay */
        }
        
        /* Capa semi-transparente sobre la imagen de fondo */
        .overlay {
            position: absolute; /* Posicionamiento absoluto para cubrir todo el fondo */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6); /* Color negro con opacidad */
            z-index: 1; /* Asegurarse de que esté detrás del contenido */
        }

        .content-box {
            background-color: rgba(255, 255, 255, 0.9); /* Aumentar opacidad */
            padding: 40px; /* Aumentar padding para más espacio interior */
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Aumentar sombra para más profundidad */
            max-width: 400px; /* Aumentar ancho máximo del contenedor */
            width: 90%; /* Mantener responsive */
            z-index: 2; /* Asegurarse de que esté encima de la capa de fondo */
        }

        .logo {
            width: 150px; /* Reducir tamaño de la imagen */
            height: auto; /* Mantener proporción */
            margin-bottom: 15px; /* Separación entre el logo y el título */
        }

        .role-selection {
            margin-top: 20px; /* Aumentar margen superior para separar los botones */
        }

        h4 {
            margin-bottom: 20px; /* Separación entre el título y los botones */
            font-size: 28px; /* Aumentar tamaño de fuente del título */
            font-family: 'Arial', sans-serif; /* Tipo de fuente */
        }

        .btn {
            width: 250px; /* Ancho fijo para los botones */
            margin: 5px auto; /* Separar los botones entre sí y centrar */
            font-size: 16px; /* Tamaño de fuente para los botones */
        }
    </style>
</head>
<body>
    <div class="overlay"></div> <!-- Capa semi-transparente -->
    <div class="content-box">
        <img src="/logo.png" alt="Logo de CHIMESUBO" class="logo"> <!-- Logo agregado aquí -->
        <div class="role-selection">
            <h4>¿Quién eres?</h4>
            <a href="{{ url_for('login', role='gerente') }}" class="btn btn-danger">Gerente</a>
            <a href="{{ url_for('login', role='vendedor') }}" class="btn btn-primary">Vendedor</a>
        </div>
    </div>
</body>
</html>
