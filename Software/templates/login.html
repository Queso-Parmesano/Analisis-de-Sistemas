<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('/fondoindex.jpg'); /* Ajusta la ruta de la imagen */
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
        }

        .overlay {
            position: absolute; /* Posicionamiento absoluto para cubrir todo el fondo */
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.6); /* Color negro con opacidad */
            z-index: 1; /* Asegurarse de que esté detrás del contenido */
        }
        
        .content-box {
            background-color: rgba(255, 255, 255, 0.86); /* Fondo blanco con opacidad */
            padding: 40px;
            border-radius: 10px; /* Bordes redondeados */
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2); /* Sombra más pronunciada */
            max-width: 400px; /* Tamaño máximo para mantenerlo compacto */
            width: 90%; /* Ajustar a un ancho más flexible */
            z-index: 2; /* Asegurarse de que esté encima de la capa de fondo */
        }

        .logo {
            width: 100%; /* Ajustar el logo al ancho del contenedor */
            height: auto; /* Mantener proporción */
            max-width: 150px; /* Tamaño máximo para que no sea demasiado grande */
            margin-bottom: 15px; /* Separación entre el logo y el título */
        }

        h1 {
            font-size: 24px; /* Tamaño de fuente del título */
            font-family: 'Arial', sans-serif; /* Tipo de fuente */
            margin: 15px 0; /* Espaciado alrededor del título */
        }

        .form-group {
            margin-top: 15px; /* Separación entre los campos del formulario */
        }
        
        .back-button {
            margin-top: 15px; /* Separación entre el botón de volver y el formulario */
        }

        .btn {
            font-size: 16px; /* Tamaño de fuente para los botones */
        }
    </style>
</head>
<body>
    <div class="overlay"></div> <!-- Capa semi-transparente -->
    <div class="content-box">
        <img src="/logo.png" alt="Logo de CHIMESUBO" class="logo"> <!-- Logo agregado aquí -->
        <h1 class="mt-3">Iniciar Sesión como {{ role.capitalize() }}</h1>
        <form method="POST">
            <div class="form-group">
                <label for="username">Nombre de usuario</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn {{ 'btn-danger' if role == 'gerente' else 'btn-primary' }} btn-block">Iniciar Sesión</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn btn-secondary btn-block back-button">Volver</a>
    </div>
</body>
</html>
